# Visits the live app every 6 hours so Streamlit Community Cloud doesn't
# leave it asleep. Can also be run by hand from the Actions tab.
name: Keep app awake

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours, at a quiet minute past the hour
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install a headless browser
        run: |
          pip install playwright==1.65.2
          python -m playwright install --with-deps chromium
      - name: Visit the app (wake it if asleep)
        run: python scripts/keep_awake.py
